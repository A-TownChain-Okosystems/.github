name: Organization Ruff Code Quality

on:
  workflow_call:
    inputs:
      policy_dir:
        description: Policy checkout directory; MUST remain outside the lint target or be excluded from every caller scan.
        required: false
        type: string
        default: .org-github-policy

permissions:
  contents: read

env:
  POLICY_DIR: ${{ inputs.policy_dir }}
  RUFF_POLICY_BUNDLE_SHA: b2d84765eba25a0d1e67ffdf21e9fdbd37d058b6
  RUFF_POLICY_FILE_SHA: 6763406fc3c11cf109185bb1322a0c4ba59dab0c

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Checkout organization Ruff policy bundle
        uses: actions/checkout@v4
        with:
          repository: A-TownChain-Okosystems/.github
          ref: b2d84765eba25a0d1e67ffdf21e9fdbd37d058b6
          path: ${{ inputs.policy_dir }}
          persist-credentials: false

      - name: Select centralized Ruff configuration
        shell: bash
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          override="$POLICY_DIR/ruff-overrides/${repo_name}.toml"
          if [ -f "$override" ]; then
            echo "Using centralized Ruff override: $override"
            echo "RUFF_CONFIG=$override" >> "$GITHUB_ENV"
            echo "RUFF_OVERRIDE_FILE=$override" >> "$GITHUB_ENV"
            echo "RUFF_OVERRIDE_ACTIVE=true" >> "$GITHUB_ENV"
          else
            echo "No centralized Ruff override for $repo_name; using base policy."
            echo "RUFF_CONFIG=$POLICY_DIR/ruff.toml" >> "$GITHUB_ENV"
            echo "RUFF_OVERRIDE_FILE=" >> "$GITHUB_ENV"
            echo "RUFF_OVERRIDE_ACTIVE=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check --no-input ruff==0.16.7

      - name: Validate override policy and staleness
        if: env.RUFF_OVERRIDE_ACTIVE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUFF_OVERRIDE_FILE" "$POLICY_DIR/ruff-overrides/ALLOWLIST.toml" <<'PY'
          import sys
          import tomllib

          override_path, allowlist_path = sys.argv[1], sys.argv[2]
          with open(override_path, "rb") as handle:
              override = tomllib.load(handle)
          with open(allowlist_path, "rb") as handle:
              allowlist = tomllib.load(handle)

          requested = set(override.get("lint", {}).get("ignore", []))
          approved = set(allowlist.get("approved", {}).get("rules", []))
          if not requested:
              raise SystemExit("RUFF_OVERRIDE_INVALID: no lint.ignore rules declared")
          unexpected = sorted(requested - approved)
          if unexpected:
              raise SystemExit(
                  "RUFF_OVERRIDE_INVALID: unapproved rules: " + ", ".join(unexpected)
              )
          print("Approved override rules: " + ", ".join(sorted(requested)))
          PY

          base_config="$POLICY_DIR/ruff.toml"
          report="$(mktemp)"
          set +e
          ruff check . --exclude "$POLICY_DIR" --config "$base_config" >"$report" 2>&1
          rc=$?
          set -e
          cat "$report"

          if [ "$rc" -eq 0 ]; then
            echo "RUFF_OVERRIDE_STALE: base policy is already clean; remove the centralized override."
            exit 1
          fi

          python - "$RUFF_OVERRIDE_FILE" "$report" <<'PY'
          import re
          import sys
          import tomllib

          override_path, report_path = sys.argv[1], sys.argv[2]
          with open(override_path, "rb") as handle:
              rules = tomllib.load(handle).get("lint", {}).get("ignore", [])
          report = open(report_path, encoding="utf-8").read()
          missing = [
              rule for rule in rules
              if not re.search(rf"(?<![A-Z0-9]){re.escape(rule)}(?![A-Z0-9])", report)
          ]
          if missing:
              raise SystemExit(
                  "RUFF_OVERRIDE_STALE: base-policy failures contain none of the "
                  "relaxed rules: " + ", ".join(sorted(missing))
              )
          print("Centralized Ruff override is active; base policy still reports an overridden rule.")
          PY

      - name: Ruff lint
        run: ruff check . --exclude "$POLICY_DIR" --config "$RUFF_CONFIG"

      - name: Ruff format check
        run: ruff format --check . --exclude "$POLICY_DIR" --config "$RUFF_CONFIG"
