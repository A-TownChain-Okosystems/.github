name: Organization Ruff Code Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Checkout organization Ruff policy
        uses: actions/checkout@v4
        with:
          repository: A-TownChain-Okosystems/.github
          ref: 7994fca8b24aef3572be1fa44adaf9c59fc13eb8
          path: .org-github-policy
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check --no-input ruff==0.16.7

      - name: Ruff lint
        run: ruff check . --config .org-github-policy/ruff.toml

      - name: Ruff format check
        run: ruff format --check . --config .org-github-policy/ruff.toml
