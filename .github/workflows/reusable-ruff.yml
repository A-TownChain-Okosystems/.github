name: Organization Ruff Code Quality

on:
  workflow_call:
    inputs:
      policy_dir:
        description: Policy checkout directory; MUST remain outside the lint target or be excluded from every caller scan.
        required: false
        type: string
        default: .org-github-policy

permissions:
  contents: read

env:
  POLICY_DIR: ${{ inputs.policy_dir }}
  RUFF_POLICY_SHA: 7994fca8b24aef3572be1fa44adaf9c59fc13eb8

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Checkout organization Ruff policy
        uses: actions/checkout@v4
        with:
          repository: A-TownChain-Okosystems/.github
          ref: 7994fca8b24aef3572be1fa44adaf9c59fc13eb8
          path: ${{ inputs.policy_dir }}
          persist-credentials: false

      - name: Select centralized Ruff configuration
        shell: bash
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          override="$POLICY_DIR/ruff-overrides/${repo_name}.toml"
          if [ -f "$override" ]; then
            echo "Using centralized Ruff override: $override"
            echo "RUFF_CONFIG=$override" >> "$GITHUB_ENV"
            echo "RUFF_OVERRIDE_ACTIVE=true" >> "$GITHUB_ENV"
          else
            echo "No centralized Ruff override for $repo_name; using base policy."
            echo "RUFF_CONFIG=$POLICY_DIR/ruff.toml" >> "$GITHUB_ENV"
            echo "RUFF_OVERRIDE_ACTIVE=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check --no-input ruff==0.16.7

      - name: Validate override is not stale
        if: env.RUFF_OVERRIDE_ACTIVE == 'true'
        shell: bash
        run: |
          set -u
          base_config="$POLICY_DIR/ruff.toml"
          report="$(mktemp)"
          set +e
          ruff check . --exclude "$POLICY_DIR" --config "$base_config" >"$report" 2>&1
          rc=$?
          set -e
          cat "$report"
          if [ "$rc" -eq 0 ]; then
            echo "RUFF_OVERRIDE_STALE: base policy is already clean; remove the centralized override."
            exit 1
          fi
          if ! grep -Eq '(^|[[:space:]:])(E701|E702)([[:space:]:]|$)' "$report"; then
            echo "RUFF_OVERRIDE_STALE: base-policy failures contain none of the rules relaxed by this override."
            exit 1
          fi
          echo "Centralized Ruff override is active: base policy still reports an overridden rule."

      - name: Ruff lint
        run: ruff check . --exclude "$POLICY_DIR" --config "$RUFF_CONFIG"

      - name: Ruff format check
        run: ruff format --check . --exclude "$POLICY_DIR" --config "$RUFF_CONFIG"
