name: Org Compliance Scan
on:
  schedule:
    - cron: "0 5 * * 1"  # montags 05:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pyyaml
      - name: Scan ausfuehren
        env: {GITHUB_ACCESS_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: python3 tools/org_compliance_scan.py --output docs/compliance
      - name: Report committen
        continue-on-error: true  # Branch-Protection: sonst laeuft der Scan als Artifact weiter
        run: |
          git config user.name "org-compliance-scan-bot"
          git config user.email "actions@github.com"
          git add docs/compliance
          git diff --cached --quiet && echo "Keine Aenderungen" && exit 0
          git commit -m "chore(compliance): Org-Compliance-Scan $(date -u +%F) [agent: org-compliance-scan-bot]"
          git push
      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: compliance-report, path: docs/compliance}
