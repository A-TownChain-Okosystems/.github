name: Org Compliance Scan
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.11"}
      - run: pip install requests pyyaml
      - name: Scan ausfuehren
        env: {GITHUB_ACCESS_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: python3 tools/org_compliance_scan.py --output docs/compliance
      - name: Report committen
        continue-on-error: true
        run: |
          git config user.name "org-compliance-scan-bot"
          git config user.email "actions@github.com"
          git add docs/compliance
          git diff --cached --quiet && echo "Keine Aenderungen" && exit 0
          git commit -m "chore(compliance): Org-Compliance-Scan $(date -u +%F) [agent: org-compliance-scan-bot]"
          git push
      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: compliance-report, path: docs/compliance}
