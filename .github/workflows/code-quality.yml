# ATC Code Quality Gate — ATC-STD-081 (Coding) / ATC-STD-082 (Code Style)
name: ATC Code Quality (STD-081/082)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - name: Ruff installieren
        run: pip install ruff==0.16.7
      - name: Lint-Pruefung
        run: ruff check .
      - name: Format-Pruefung
        run: ruff format --check .
