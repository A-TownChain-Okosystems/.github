name: Organization Markdown Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint-cli2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Checkout organization Markdown policy
        uses: actions/checkout@v4
        with:
          repository: A-TownChain-Okosystems/.github
          ref: main
          path: .org-github-policy
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .org-github-policy/policies/markdownlint/.markdownlint-cli2.jsonc
          globs: |
            **/*.md
            !.git/**
