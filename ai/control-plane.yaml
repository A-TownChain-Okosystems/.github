artifacts:
  agent_checks:
    files: ai/checks/AGENT-001..015.yaml
    resp: Agent-Governance-Messung (ATC-CHECK-AGENT-NNN)
  audit:
    files: ai/audit/*.yaml
    resp: Bewertung + Finding-Schema
  authorization_engine:
    file: tools/authorize.py
    resp: ALLOW/DENY-Entscheidung VOR der Aktion (Identity→Status→Role→Capability→Permission→Scope→Policy)
  capabilities:
    file: ai/capabilities.yaml
    resp: Berechtigungsmodell
  checks:
    files: ai/checks/CHECK-001..020.yaml
    resp: Messung (Objekte) + ai/checks.yaml (Katalog)
  exceptions:
    file: ai/exceptions.yaml
    resp: Policy-Ausnahmen mit Ablaufdatum-Pflicht
  governance_rules:
    file: ai/governance-rules.yaml
    resp: Snapshot/Merge-Gate/Exception/Conflict
  identity:
    file: AGENT_MANIFEST.md
    resp: Identitaet
  machine_identity:
    file: ai/agent.yaml
    resp: Maschinenidentitaet
  permissions:
    file: ai/permissions.yaml
    resp: GitHub-Operationen-Erlaubnismodell
  policies:
    file: ai/policies.yaml
    resp: Regeln (AP + ATC-POL)
  schemas:
    files: ai/schemas/*.schema.yaml
    resp: Validierung
  state_machine:
    file: ai/state-machine.yaml
    resp: formale Compliance-State-Machine
  workflow:
    file: ai/workflow.yaml
    resp: Verbindlicher Agenten-Workflow mit Gates
enforcement_boundary:
  enforcement_kanäle:
  - 'AGOV-GATE: GitHub-Actions je Push/PR (Merge-Block bei P0/P1)'
  - 'org_governance_scan.py: zentraler Cross-Repo-Validator (Phase 6) — prueft AGENTS/MANIFEST/agent.yaml/capabilities/policies/audit/checks/CI/Evidence
    je Repository und berechnet den Repository-Status'
  - 'A1-Manifest-Gate: required_standards == ALLE Registry-Standards (dynamische Bindung)'
  inheritance: Repositories erben zentrale Policies/Capabilities vom Hub (Org-Profil-Mechanismus);
    repo-lokale AGENTS.md MUSS auf den Hub verweisen (Org-Verweisblock, AGOV-CHECK-002/003).
  local_binding_rule: 'Jedes Repository MIT aktiver Agenten-Bindung (.github/ai/agent.yaml
    mit agents.allowed) MUSS repo-lokale capabilities.yaml UND policies.yaml besitzen
    (STANDARD DEFINES IT = FILE IMPLEMENTS IT; Audit-Fund 09.09.: 404 in atc-standards).
    Repos ohne eigene Agenten-Bindung erben vollstaendig vom Hub (Verdict: INHERITED,
    Evidence: Hub-SHA).'
  ssot: 'Dieses .github-Repository ist das Organisations-Profil-Repository: sein Stamm-AGENTS.md
    und seine ai/-Artefakte gelten org-weit als zentrale Governance-Quelle.'
governance:
  framework: ATC-AI-GOV
  note: 'Jedes Repository wird gegen diese Version geprueft (Drift-Detection: Repo-Binding
    < Hub-Version = Governance-Drift)'
  version: 1.0.0
