# ATC Capability Schema — ATC-AI-GOV-CAPABILITY-001 (SCR-0064)
$schema: "http://json-schema.org/draft-07/schema#"
$id: "atc://schemas/capability.schema.yaml"
title: ATC Agent Capabilities
type: object
required: [agent_capabilities]
properties:
  agent_capabilities:
    type: object
    required: [schema, version, roles]
    properties:
      schema: {type: string, pattern: "^ATC-AGENT-CAPABILITY-1\\.[0-9]+$"}
      version: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"}
      roles:
        type: array
        items:
          type: object
          required: [id, name, permissions, forbidden]   # explizit, nie rollen-abgeleitet (REQ-AGOV-CAP-001)
          properties:
            id: {type: string, pattern: "^ATC-AI-[A-Z]+-[0-9]{3,}$"}
            name: {type: string}
            covered_by: {type: [string, "null"], description: "registrierte Instanz oder NULL (= Profil, ehrlich)"}
            permissions: {type: array, minItems: 1, items: {type: string}}
            forbidden: {type: array, items: {type: string}}
