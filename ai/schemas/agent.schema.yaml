# ATC Agent Identity Schema — ATC-AI-GOV-MANIFEST-001 REQ-AGOV-MAN-006 (SCR-0062, Phase 1)
# Validiert: ai/agent.yaml (Org-Hub) und repo-lokale agent-Manifeste
$schema: "http://json-schema.org/draft-07/schema#"
$id: "atc://schemas/agent.schema.yaml"
title: ATC Agent Identity
type: object
required: [schema_version, organization, agent, scope, capabilities]
properties:
  schema_version: {type: string, pattern: "^1\\.[0-9]+$"}
  organization:
    type: object
    required: [id]
    properties:
      id: {type: string, const: "A-TownChain-Okosystems"}
      governance: {type: string, pattern: "^ATC-AI-GOV$"}
  agent:
    type: object
    required: [id, name, role, version, status]   # REQ-AGOV-MAN-001 Pflichtfelder
    properties:
      id: {type: string, pattern: "^ATC-AI-[A-Z]+-[0-9]{3,}$", example: "ATC-AI-ARCH-001"}
      name: {type: string}
      role: {type: string}
      version: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"}   # SemVer, ATC-STD-VERSION-001
      status: {enum: [proposed, active, suspended, deprecated, retired]}   # REQ-AGOV-MAN-002 (lowercase in YAML)
  scope:
    type: object
    required: [level]
    properties:
      level: {enum: [organization, repository, directory, module, task]}   # REQ-AGOV-MAN-005
      restrictions: {type: array, items: {type: string}}
  capabilities:
    type: array
    minItems: 1
    items: {type: string, pattern: "^[A-Z][A-Z_]+$"}   # REQ-AGOV-MAN-004: explizit, nie rollen-abgeleitet
  governance:
    type: object
    properties:
      manifest: {type: string}
      instructions: {type: string}
      policies: {type: string}
  requirements:
    type: object
    properties:
      inspect_before_modify: {type: boolean}
      validate_changes: {type: boolean}
      security_review: {type: boolean}
      regression_review: {type: boolean}
      diff_review: {type: boolean}
      documentation_review: {type: boolean}
