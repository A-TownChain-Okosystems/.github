# ATC Policy Exceptions — GOV-025 (SCR-0064)
# Regel: KEINE dauerhaften Ausnahmen ohne Ablaufdatum (expires MUSS gesetzt sein).
# Fail Closed: abgelaufene Ausnahmen sind automatisch inaktiv.
# risiko + kompensationskontrolle PFLICHT (keine unkompensierte Risikouebernahme).
# review_date PFLICHT; Ausnahmen laufen ab.
schema_version: "1.0"
id: ATC-AI-GOV-EXCEPTIONS
version: "1.1.0"
status: ACTIVE
owner: "A-TownChain Okosystems (Michael Wroblewski)"
rules:
  - "Jede Ausnahme referenziert genau eine Policy (ATC-POL-NNN) und max. einen Scope."
  - "expires ist PFLICHT; abgelaufene Ausnahmen sind automatisch inaktiv (Fail Closed)."
  - "approved_by: OWNER ist Pflicht; Agent darf keine Selbst-Ausnahme erteilen (No Self-Certification)."
  - "risiko + kompensationskontrolle PFLICHT (keine unkompensierte Risikouebernahme)."
  - "Ausnahmen laufen ab — abgelaufene Ausnahmen sind inaktiv; review_date PFLICHT."
  - "Jede Ausnahme wird im Audit-Lauf geprueft (Drift/Erosion-Erkennung)."
exceptions:
