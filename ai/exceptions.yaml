    approved_by: OWNER
    expires: "2026-09-30"
    status: ACTIVE
    scr: SCR-0077
    risiko: "P2 — Owner-Approval liegt schriftlich vor (Chat 10.09. 20:58); Merge-Inhalt vollstaendig verifiziert (23/23 Tests)"
    kompensationskontrolle: "AGOV T1-T23 + agov_check + gov_drift --repo .github gruen; Post-Merge-Verifikation gegen main; Exception laeuft am 30.09. ab (Fail Closed)"
    review_date: "2026-09-15"
    genehmiger: "Michael Wroblewski"
