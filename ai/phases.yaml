id: ATC-AI-GOV-PHASES
owner: A-TownChain Okosystems (Michael Wroblewski)
phases:
- artifacts: ai/schemas/agent+policy+check.schema.yaml, ai/audit/audit-policy+finding-schema.yaml
  id: PHASE-1
  name: Governance-Schemas
  status: DONE
- artifacts: ai/checks/CHECK-001..020.yaml (alle Objekte, Generator tools/gen_check_objects.py)
  id: PHASE-2
  name: CHECK-001..020 als Objekte
  status: DONE
- artifacts: tools/atc_governance_auditor.py (unabhaengige Check-Ausfuehrung, Evidence-Kette,
    Repository-Status)
  id: PHASE-3
  name: ATC Governance Auditor
  status: PLANNED
- artifacts: AGOV-Gate je PR/Push (Merge-Block bei P0/P1)
  id: PHASE-4
  name: GitHub-Actions-Enforcement
  status: PLANNED
- artifacts: Findings → Issues automatisch; Recheck → VERIFIED
  id: PHASE-5
  name: Issue/PR-Automation
  status: PLANNED
- artifacts: Org-Lauf ueber alle 26+ Repos (AGOV-FULL); tools/org_governance_scan.py
    (SCR-0063)
  id: PHASE-6
  name: Cross-Repository-Audit
  status: STARTED
- artifacts: Zentrale Status-Sicht (BLOCKED/NON-COMPLIANT/COMPLIANT-WITH-FINDINGS/COMPLIANT/VERIFIED
    je Repo)
  id: PHASE-7
  name: Organization-Compliance-Dashboard
  status: PLANNED
responsibilities:
  AGENTS.md: Verhalten
  AGENT_MANIFEST.md: Identität
  AUDIT: Bewertung
  CHECK-NNN: Messung
  FINDING: festgestellter Verstoß
  ISSUE: operative Behebung
  RECHECK: Verifikation
  agent.yaml: Maschinenidentität
  capabilities.yaml: Berechtigungsmodell
  policies.yaml: Regeln
schema_version: '1.0'
version: 1.1.0
